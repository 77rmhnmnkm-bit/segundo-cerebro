  y:"Encontrei 138 pares assim. Sufixo curto em odontologia costuma ser cor, calibre ou tamanho — juntar seria erro clínico.",a:["Certo, são distintas","Revisar os 138"]},
 {k:"pergunta",t:"<b>39 lotes estão com informação faltando ou suspeita</b> — sem local, sem quantidade, ou validade em 2050.",
  y:"Não alterei nada: você pediu para não mexer em lote nem validade. Marquei com ! e listei.",a:["Ver os 39","Depois"]},
 {k:"planejamento",t:"<b>16 lotes morrem em 30/11.</b> Nas terças você usa mais endodontia; 5 desses 16 são de endodontia.",
  y:"Leitura do assistente local (Qwen2.5 no seu Mac). Sugestão, não regra.",a:["Montar lista de queima","Depois"]}
];
const $=i=>document.getElementById(i);
const list=$("list"),card=$("card"),filt=$("filt"),sug=$("sug"),rev=$("rev");
let view="estoque",mode="lista",spec=null,loc=null,only=null,term="",ri=0,lim=60,CUR=[];

const strip=s=>(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]/g,"");
function lev(a,b){const m=[...Array(b.length+1)].map((_,i)=>[i,...Array(a.length).fill(0)]);
  for(let j=0;j<=a.length;j++)m[0][j]=j;
  for(let i=1;i<=b.length;i++)for(let j=1;j<=a.length;j++)
    m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[j-1]===b[i-1]?0:1));
  return m[b.length][a.length];}

const PROD=(()=>{const m=new Map();
  for(const d of D){const k=strip(d.n)+"|"+strip(d.b);
    if(!m.has(k)) m.set(k,{n:d.n,b:d.b,cat:d.cat,loc:"—",lote:"—",v:"—",u:"—",sit:"—",un:"",
      q:0,lotes:0,s:"zero",tag:"acabou",prod:1});
    const p=m.get(k); p.q+=d.q; p.lotes++; if(d.un&&!p.un)p.un=d.un;}
  return [...m.values()];})();
const COMPRAR=PROD.filter(p=>p.q===0).map(p=>({...p,u:`${p.lotes} lote${p.lotes>1?"s":""} já registrado${p.lotes>1?"s":""}`}));
function pool(){
  if(view==="comprar") return COMPRAR;
  if(view==="historico") return D.filter(d=>d.hist);
  if(view==="validade") return D.filter(d=>!d.hist&&(d.s==="venc"||d.s==="trap"));
  return D.filter(d=>!d.hist&&d.q>0);
}
function pass(d){
  if(spec&&d.cat!==spec) return false;
  if(loc&&d.loc!==loc) return false;
  if(only==="flag"&&!d.flag) return false;
  if(only==="aberto"&&d.sit!=="Aberto") return false;
  if(term){const t=strip(term); if(!strip(d.n).includes(t)&&!strip(d.b).includes(t)) return false;}
  return true;
}
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
function counts(){
  $("c-estoque").textContent=D.filter(d=>!d.hist&&d.q>0).length;
  $("c-validade").textContent=D.filter(d=>!d.hist&&(d.s==="venc"||d.s==="trap")).length;
  $("c-comprar").textContent=COMPRAR.length;
  $("c-hist").textContent=D.filter(d=>d.hist).length;
}
function draw(){
  const all=pool().filter(pass), v=all.slice(0,lim);
  CUR=v;
  list.className="glass "+(mode==="icones"?"grid":"list");
  if(!all.length){list.innerHTML='<p class="empty">Nada aqui com esses filtros.</p>';}
  else if(mode==="icones"){
    list.innerHTML=v.map((d,i)=>`<button class="tile" data-i="${i}">
      <span class="tn">${esc(d.n)}${d.flag?' <span class="flag">!</span>':""}</span>
      <span class="tb">${esc(d.b)}</span>
      <span class="tq">${d.q||0}<i>${esc(d.un||"")}</i></span>
      <span class="tf"><span class="tag t-${d.s}">${esc(d.tag)}</span></span></button>`).join("");
  }else{
    list.innerHTML=v.map((d,i)=>`<button class="row" data-i="${i}">
     <span class="stripe s-${d.s}"></span>
     <span class="nm">${esc(d.n)}${d.flag?' <span class="flag" aria-label="falta informação">!</span>':""}<span class="br"> · ${esc(d.b)}${d.lote!=="—"?" · "+esc(d.lote):""}</span></span>
     <span class="tagw"><span class="tag t-${d.s}">${esc(d.tag)}</span></span>
     <span class="qt q1">${d.q?d.q+" "+esc(d.un):"—"}</span>
     <span class="qt">${esc(d.u)}</span></button>`).join("");
  }
  if(all.length>lim) list.insertAdjacentHTML("beforeend",
    `<button class="more" id="more">Mostrar mais ${Math.min(60,all.length-lim)} · faltam ${all.length-lim}</button>`);
  const nm={estoque:"em estoque",validade:"com alerta de validade",comprar:"para comprar",historico:"no histórico"}[view];
  $("sub").textContent=`${all.length} ${nm}${spec?" · "+spec:""}${loc?" · "+loc:""} · ${PROD.length} produtos no catálogo`;
  counts();
}
function place(el,anchor,w){
  const a=anchor.getBoundingClientRect(), p=document.querySelector(".wrap").getBoundingClientRect();
  el.style.top=(a.bottom-p.top+6)+"px";
  el.style.left=Math.max(8,Math.min(a.left-p.left,p.width-w-8))+"px";
}
function open(el){
  const d=CUR[el.dataset.i]; if(!d) return;
  card.innerHTML=`<h3>${esc(d.n)}</h3><p class="cbr">${esc(d.b)}${d.lote!=="—"?" · lote "+esc(d.lote):""}</p>
   <dl><dt>Validade</dt><dd>${esc(d.v)}</dd>
   <dt>Usar até</dt><dd style="color:${d.s==="venc"?"var(--venc)":d.s==="trap"?"var(--trap)":"inherit"}">${esc(d.u)}</dd>
   <dt>Em estoque</dt><dd>${d.q?d.q+" "+esc(d.un):"0"}</dd>
   <dt>Local</dt><dd class="tx">${esc(d.loc)}</dd>
   <dt>Especialidade</dt><dd class="tx">${esc(d.cat)}</dd>
   <dt>Situação</dt><dd class="tx">${esc(d.sit)}</dd></dl>
   ${d.flag?`<div class="warn">${esc(d.flag)}</div>`:""}
   <div class="acts">${d.prod?`<button data-a="in" data-i="${el.dataset.i}">Comprar / dar entrada</button>`:`<button data-a="in" data-i="${el.dataset.i}">Entrada</button>
     <button data-a="out" data-i="${el.dataset.i}">Saída</button>`}
     <button data-a="hist">Histórico</button></div>
   ${d.q>0?`<div class="acts sec"><button class="dang" data-a="all" data-i="${el.dataset.i}">Descartar tudo (${d.q})</button></div>`:""}`;
  const p=document.querySelector(".wrap").getBoundingClientRect(), a=el.getBoundingClientRect();
  card.style.top=(a.bottom-p.top+6)+"px";
  card.style.left=Math.max(8,Math.min(a.left-p.left,p.width-334))+"px";
  card.classList.add("on"); el.classList.add("open");
}
function close(){card.classList.remove("on");document.querySelectorAll(".open").forEach(r=>r.classList.remove("open"));}
let t;
const sel=".row,.tile";
list.addEventListener("pointerover",e=>{const r=e.target.closest(sel);if(!r)return;clearTimeout(t);t=setTimeout(()=>open(r),170);});
list.addEventListener("pointerleave",()=>{clearTimeout(t);t=setTimeout(close,180);});
card.addEventListener("pointerenter",()=>clearTimeout(t));
card.addEventListener("pointerleave",()=>{t=setTimeout(close,140);});
list.addEventListener("click",e=>{
  if(e.target.closest("#more")){lim+=60;draw();return;}
  const r=e.target.closest(sel); if(r){clearTimeout(t);open(r);}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){close();filt.classList.remove("on");sug.classList.remove("on");$("modal").classList.remove("on");}});

function drawFilt(){
  filt.innerHTML=`<p class="fh">Especialidade</p><div class="fscroll">${
    CATS.map(([n,c])=>`<button class="sp" data-t="spec" data-x="${esc(n)}" aria-pressed="${spec===n}"><span>${esc(n)}</span><b>${c}</b></button>`).join("")}</div>
   <p class="fh">Local</p><div class="fscroll">${
    LOCS.map(n=>`<button class="sp" data-t="loc" data-x="${esc(n)}" aria-pressed="${loc===n}"><span>${esc(n)}</span></button>`).join("")}</div>
   <p class="fh">Só mostrar</p>
   <button class="sp" data-t="only" data-x="flag" aria-pressed="${only==="flag"}"><span>Falta informação</span><b>39</b></button>
   <button class="sp" data-t="only" data-x="aberto" aria-pressed="${only==="aberto"}"><span>Frascos abertos</span></button>
   <button class="fclear" data-t="clear">Limpar filtros</button>`;
}
$("filt-btn").onclick=e=>{
  const on=!filt.classList.contains("on");
  if(on){drawFilt();place(filt,e.currentTarget,250);}
  filt.classList.toggle("on",on); e.currentTarget.setAttribute("aria-expanded",on); close();};
filt.onclick=e=>{
  const b=e.target.closest("button"); if(!b) return;
  const ty=b.dataset.t,x=b.dataset.x;
  if(ty==="clear"){spec=loc=only=null;}
  else if(ty==="spec") spec=spec===x?null:x;
  else if(ty==="loc") loc=loc===x?null:x;
  else if(ty==="only") only=only===x?null:x;
  lim=60; drawFilt(); draw();};
document.addEventListener("click",e=>{
  if(!filt.contains(e.target)&&!$("filt-btn").contains(e.target)){
    filt.classList.remove("on");$("filt-btn").setAttribute("aria-expanded","false");}
  if(!sug.contains(e.target)&&e.target!==$("q")) sug.classList.remove("on");});

$("q").addEventListener("input",e=>{
  term=e.target.value; lim=60; draw();
  const t=strip(term);
  if(t.length<3||pool().filter(pass).length){sug.classList.remove("on");return;}
  const near=D.map(d=>({d,k:lev(t,strip(d.n))}))
    .filter(o=>o.k<=Math.max(2,Math.ceil(strip(o.d.n).length*.34)))
    .sort((a,b)=>a.k-b.k).slice(0,4);
  if(!near.length){sug.classList.remove("on");return;}
  sug.innerHTML=`<p class="sh">Não achei “${esc(term)}”. Você quis dizer:</p>`+
    near.map(o=>`<button data-n="${esc(o.d.n)}"><em>${esc(o.d.n)}</em> · ${esc(o.d.b)}</button>`).join("");
  place(sug,e.target,246); sug.classList.add("on");});
sug.onclick=e=>{const b=e.target.closest("button[data-n]");if(!b)return;
  $("q").value=b.dataset.n; term=b.dataset.n; sug.classList.remove("on"); lim=60; draw();
  toast("Corrigido para “"+b.dataset.n+"”");};

function drawRev(){const r=REV[ri];
  rev.innerHTML=`<span class="dot"></span><div class="body">
    <p class="kind">${r.k}</p><p>${r.t}</p><p class="why">${r.y}</p>
    <div class="ra">${r.a.map((a,i)=>`<button class="${i===0?"prim":""}" data-r="${i}">${a}</button>`).join("")}</div>
   </div><span class="nav">${ri+1}/${REV.length}</span>`;}
rev.onclick=e=>{const b=e.target.closest("button[data-r]");if(!b)return;
  toast(b.textContent+" — registrado no histórico"); ri=(ri+1)%REV.length; drawRev();};

function toast(m){const el=$("toast");el.textContent=m;el.classList.add("on");
  clearTimeout(toast._);toast._=setTimeout(()=>el.classList.remove("on"),2800);}

card.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  if(b.dataset.a==="hist"){toast("Histórico do lote — todos os movimentos registrados");return;}
  if(b.dataset.a==="all"){discardAll(CUR[b.dataset.i]);return;}
  flow(CUR[b.dataset.i],b.dataset.a);});

const REASONS=["Vencido","Danificado","Contaminado","Perdido","Devolvido"];
function discardAll(d){
  close(); let reason=d.s==="venc"?"Vencido":null;
  const modal=$("modal"),sheet=$("sheet");
  function render(){
    sheet.innerHTML=`<h2>Descartar tudo</h2><p class="sh2">${esc(d.n)} · ${esc(d.b)} · lote ${esc(d.lote)}</p>
     <p class="big">${d.q}</p><p class="bigl">${esc(d.un||"unidades")} saem do estoque de uma vez</p>
     <p class="fh" style="margin:0 0 7px">Motivo</p>
     <div class="reasons">${REASONS.map(r=>`<button data-r="${r}" aria-pressed="${reason===r}">${r}</button>`).join("")}</div>
     <div class="ledger">lote &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span>${esc(d.lote)}</span>
tipo &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span>descarte total</span>
quantidade <span>${d.q}</span>
motivo &nbsp;&nbsp;&nbsp;&nbsp;<span>${reason||"— escolha acima"}</span>
data/hora &nbsp;<span>10/08/2026 16:41</span>
usuário &nbsp;&nbsp;&nbsp;<span>Ricardo A. de Azevedo</span>
saldo &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span>${d.q} → 0</span></div>
     <p class="sh2" style="margin:0 0 13px">O lote continua no histórico e o produto entra na lista de compras. Nada é apagado.</p>
     <div class="acts"><button data-x="cancel">Cancelar</button>
       <button class="dang" data-x="done" ${reason?"":"disabled style=opacity:.45"}>Descartar ${d.q}</button></div>`;}
  sheet.onclick=e=>{const b=e.target.closest("button");if(!b)return;
    if(b.dataset.r){reason=b.dataset.r;render();return;}
    if(b.dataset.x==="cancel"){modal.classList.remove("on");return;}
    if(b.dataset.x==="done"){
      if(!reason){toast("Escolha o motivo do descarte");return;}
      const antes=d.q; d.q=0; d.hist=1; d.s="zero"; d.tag="acabou"; d.u="—";
      modal.classList.remove("on"); draw();
      toast(`${antes} ${d.un||"un."} descartadas · motivo ${reason.toLowerCase()} · registrado`);}};
  render(); modal.classList.add("on");
}

function flow(d,dir){
  close(); let step=1,qtd=1;
  const modal=$("modal"),sheet=$("sheet");
  const bars=Array.from({length:32},()=>`<i style="height:${28+Math.random()*72}%"></i>`).join("");
  const head=()=>`<h2>${dir==="in"?"Entrada":"Saída"} de material</h2><p class="sh2">${esc(d.n)} · ${esc(d.b)}</p>
    <div class="step ${step===1?"now":"done"}"><b>${step>1?"✓":"1"}</b>Escanear o lote</div>
    <div class="step ${step===2?"now":step>2?"done":""}"><b>${step>2?"✓":"2"}</b>Informar a quantidade</div>
    <div class="step ${step===3?"now":""}"><b>3</b>Confirmar</div>`;
  function render(){
    if(step===1) sheet.innerHTML=head()+
      `<div class="view"><div class="recticle"><div class="scanline"></div></div></div>
       <p class="sh2" style="text-align:center;margin:0 0 12px">Aponte para o código do produto ou para a etiqueta QR do pote</p>
       <div class="acts"><button data-x="cancel">Cancelar</button><button class="prim" data-x="next">Li o código</button></div>`;
    if(step===2) sheet.innerHTML=head()+
      `<div class="view" style="aspect-ratio:auto;padding:16px 0"><div class="bars">${bars}</div></div>
       <div class="ledger">GS1 DataMatrix lido
(01) produto &nbsp;<span>7891234567890</span>
(10) lote &nbsp;&nbsp;&nbsp;&nbsp;<span>${esc(d.lote)}</span>
(17) validade <span>${esc(d.v)}</span></div>
       <div class="qtrow"><button data-x="minus" aria-label="Diminuir">−</button>
        <span class="qtn" id="qtn">${qtd}</span><button data-x="plus" aria-label="Aumentar">+</button></div>
       <div class="acts"><button data-x="cancel">Cancelar</button><button class="prim" data-x="next">Continuar</button></div>`;
    if(step===3){const novo=dir==="in"?d.q+qtd:Math.max(0,d.q-qtd);
      sheet.innerHTML=head()+
      `<div class="ledger">produto &nbsp;&nbsp;&nbsp;<span>${esc(d.n)}</span>
marca &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span>${esc(d.b)}</span>
lote &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span>${esc(d.lote)}</span>
tipo &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span>${dir==="in"?"entrada":"saída"}</span>
quantidade <span>${qtd}</span>
data/hora &nbsp;<span>10/08/2026 16:41</span>
usuário &nbsp;&nbsp;&nbsp;<span>Ricardo A. de Azevedo</span>
saldo &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span>${d.q} → ${novo}</span></div>
       <div class="acts"><button data-x="cancel">Cancelar</button><button class="prim" data-x="done">Confirmar</button></div>`;}
  }
  sheet.onclick=e=>{const b=e.target.closest("button");if(!b)return;
    const x=b.dataset.x;
    if(x==="cancel"){modal.classList.remove("on");return;}
    if(x==="plus"){qtd++;$("qtn").textContent=qtd;return;}
    if(x==="minus"&&qtd>1){qtd--;$("qtn").textContent=qtd;return;}
    if(x==="next"){step++;render();return;}
    if(x==="done"){d.q=dir==="in"?d.q+qtd:Math.max(0,d.q-qtd);
      if(d.q===0){d.s="zero";d.tag="acabou";d.hist=1;d.u="—";}
      modal.classList.remove("on");draw();
      toast(`${dir==="in"?"Entrada":"Saída"} de ${qtd} · saldo ${d.q} · registrado`);}};
  render(); modal.classList.add("on");
}
$("scan").onclick=()=>flow(pool()[0]||D[0],"out");
$("modal").onclick=e=>{if(e.target===$("modal"))$("modal").classList.remove("on");};
document.querySelectorAll(".seg:not(.vt) button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".seg:not(.vt) button").forEach(x=>x.setAttribute("aria-pressed","false"));
  b.setAttribute("aria-pressed","true"); view=b.dataset.v; lim=60; close(); draw();});
document.querySelectorAll(".vt button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".vt button").forEach(x=>x.setAttribute("aria-pressed","false"));
  b.setAttribute("aria-pressed","true"); mode=b.dataset.m; close(); draw();});
drawRev(); draw();
</script>
